<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <style>
    .tile { fill: #09090b }
    .mark { stroke: #ffffff }
    .node { fill: #ffffff }
    @media (prefers-color-scheme: light) {
      .tile { fill: #ffffff }
      .mark { stroke: #09090b }
      .node { fill: #09090b }
    }
  </style>
  <rect class="tile" width="1024" height="1024" rx="230.4" ry="230.4"/>
  <g class="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Letter 'O' Ring -->
    <circle cx="512" cy="512" r="320" stroke-width="70"/>
    
    <!-- Inner Concentric Orbit -->
    <circle cx="512" cy="512" r="190" stroke-width="32" stroke-dasharray="75 50" stroke-opacity="0.65"/>
    
    <!-- Center Conductor Spark -->
    <path d="M512 370 V654 M370 512 H654" stroke-width="32"/>
    <circle cx="512" cy="512" r="56" class="node" stroke="none"/>

    <!-- Agent Nodes -->
    <circle cx="512" cy="192" r="38" class="node" stroke="none"/>
    <circle cx="832" cy="512" r="38" class="node" stroke="none"/>
    <circle cx="512" cy="832" r="38" class="node" stroke="none"/>
    <circle cx="192" cy="512" r="38" class="node" stroke="none"/>
  </g>
</svg>
